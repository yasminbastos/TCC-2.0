// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
        classpath 'com.google.gms:google-services:4.4.1'
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"

// Windows may shorten clang++.exe to CLANG_~1.EXE when the SDK path
// contains spaces. Explicitly keep C++ driver mode when linking native modules.
if (System.getProperty('os.name').toLowerCase().contains('windows')) {
  subprojects { subproject ->
    subproject.plugins.withId('com.android.library') {
      subproject.android.defaultConfig.externalNativeBuild.cmake.arguments(
        '-DCMAKE_SHARED_LINKER_FLAGS=--driver-mode=g++'
      )
    }
    subproject.plugins.withId('com.android.application') {
      subproject.android.defaultConfig.externalNativeBuild.cmake.arguments(
        '-DCMAKE_SHARED_LINKER_FLAGS=--driver-mode=g++'
      )
    }
  }
}
